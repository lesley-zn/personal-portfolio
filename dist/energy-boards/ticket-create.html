<!doctype html><html lang="zh-CN" style="--scale: 0.5333333333333333;"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ticket-create / 重卡充换电网络运营平台</title><link rel="stylesheet" href="./energy-overview.css"><link rel="stylesheet" href="./energy-suite.css"><link rel="stylesheet" href="./energy-reference.css"><link rel="stylesheet" href="./energy-station-study.css"><link rel="stylesheet" href="./energy-vehicle-study.css"><link rel="stylesheet" href="./energy-trajectory-study.css"><link rel="stylesheet" href="./energy-vehicle-detail-study.css"><link rel="stylesheet" href="./energy-workorder-detail-study.css"><link rel="stylesheet" href="./energy-workorder-create-study.css"><link rel="stylesheet" href="./energy-presentation.css?v=20261110-final"><script src="./energy-presentation.js?v=20261110-final" defer=""></script></head><body class="presentation" inert=""><div class="screen-shell"><main class="screen"><header class="masthead"><div class="title-block"><div class="title-kicker">ENERGY NETWORK / COMMAND CENTER</div><h1>重卡充换电网络运营驾驶舱</h1><div class="title-rule"><i></i><b></b><i></i></div></div><div class="head-right"><span class="live-dot"></span><span>运行中</span><time id="clock">15:35:40</time></div></header><nav class="screen-nav"><span class="board-menu ">首页</span><span class="board-menu ">站控系统</span><span class="board-menu ">电池监测</span><span class="board-menu ">车辆调度</span><span class="board-menu board-active">电站管理</span></nav><div id="suite-main"><div class="create-order-layout"><form id="create-order-form" class="create-order-form"><div class="suite-toolbar"><div><h2>创建维修工单</h2><small>设备故障与维修任务登记</small></div><span class="required-note"><i>*</i> 为必填项</span></div><section class="panel create-basic"><div class="panel-title"><h2>工单基本信息</h2></div><div class="create-section-body"><div class="create-grid four"><label class="create-field"><span>工单编号<i>*</i></span><input name="number" value="KD096" placeholder="输入工单编号" required="" maxlength="80" tabindex="-1"></label><label class="create-field"><span>工单类型</span><select name="type" tabindex="-1"><option>一般性维修</option><option>计划性维修</option><option>外委性维修</option></select></label><label class="create-field"><span>优先级</span><select name="priority" tabindex="-1"><option>一般</option><option>紧急</option></select></label><label class="create-field"><span>工单状态</span><select name="status" tabindex="-1"><option>待处理</option><option>上报</option><option>待观察</option><option>待验收</option><option>待关闭</option><option>关闭</option></select></label></div><p class="create-section-note">通过优先级区分任务处理顺序，状态用于跟进维修进度。</p></div></section><section class="panel create-fault"><div class="panel-title"><h2>故障与设备信息</h2></div><div class="create-section-body"><label class="create-field create-description"><span>工单描述<i>*</i></span><textarea name="description" maxlength="300" placeholder="描述需要处理的设备故障" required="" tabindex="-1"></textarea><span class="description-count"><b id="description-count">0</b> / 300</span></label><div class="create-grid three"><label class="create-field"><span>关联问题</span><input name="issue" value="" placeholder="输入关联问题" maxlength="80" tabindex="-1"></label><label class="create-field"><span>设备<i>*</i></span><input name="device" value="" placeholder="输入设备名称" required="" maxlength="80" tabindex="-1"></label><label class="create-field"><span>部门<i>*</i></span><input name="department" value="" placeholder="输入所属部门" required="" maxlength="80" tabindex="-1"></label></div></div></section><section class="panel create-assignment"><div class="panel-title"><h2>计划与责任人员</h2></div><div class="create-section-body"><div class="create-grid two"><label class="create-field"><span>计划开始</span><input name="start" type="datetime-local" step="1" tabindex="-1"></label><label class="create-field"><span>计划结束</span><input name="end" type="datetime-local" step="1" tabindex="-1"></label><label class="create-field"><span>负责人</span><input name="owner" value="" placeholder="输入负责人姓名" maxlength="80" tabindex="-1"></label><label class="create-field"><span>处理人</span><input name="handler" value="" placeholder="输入处理人姓名" maxlength="80" tabindex="-1"></label></div></div></section><div class="create-actions"><span id="save-feedback">填写工单信息后保存</span><div><button class="suite-button" type="reset" tabindex="-1">重置内容</button><button class="suite-button primary" type="submit" tabindex="-1">保存工单</button></div></div></form><aside class="create-order-side"><section class="panel create-preview-panel"><div class="panel-title"><h2>工单摘要</h2></div><div class="create-section-body"><div class="create-preview-heading"><span>工单编号</span><h2 id="preview-number">KD096</h2><b id="preview-saved">尚未保存</b></div><div class="preview-tags"><span id="preview-priority">一般</span><span id="preview-status">待处理</span></div><div class="preview-description"><span>工单描述</span><p id="preview-description">等待填写故障描述</p></div><dl class="create-preview-fields"><div><dt>工单类型</dt><dd id="preview-type">一般性维修</dd></div><div><dt>设备</dt><dd id="preview-device">未填写</dd></div><div><dt>部门</dt><dd id="preview-department">未填写</dd></div><div><dt>负责人</dt><dd id="preview-owner">未填写</dd></div><div><dt>处理人</dt><dd id="preview-handler">未填写</dd></div><div><dt>计划开始</dt><dd id="preview-start">未设置</dd></div><div><dt>计划结束</dt><dd id="preview-end">未设置</dd></div></dl></div></section></aside></div></div></main></div>
</body></html>
